services:
  - type: web
    name: lifequest-ai-v107
    runtime: node
    plan: free
    region: singapore
    buildCommand: sh build.sh
    startCommand: node server.cjs
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-haiku-4-5
      - key: AI_DAILY_REQUEST_LIMIT
        value: '50'
      - key: AI_HOURLY_REQUEST_LIMIT
        value: '20'
      - key: NODE_VERSION
        value: '22'
