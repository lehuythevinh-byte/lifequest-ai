services:
  - type: web
    name: lifequest-ai-v70
    runtime: static
    buildCommand: 'mkdir -p public && test "$(find v70/parts -type f -name ''p*.txt'' | wc -l)" -eq 44 && cat v70/parts/p*.txt > public/index.html && echo "8476d3b98ef3c133df6bc785956c19def9d036cccebbdb2acf52a31564f6ce21  public/index.html" | sha256sum -c -'
    staticPublishPath: ./public
    autoDeployTrigger: commit
